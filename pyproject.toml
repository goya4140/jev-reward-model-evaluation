[project]
name = "jev-reward-eval"
version = "0.1.0"
description = "Evaluate Jev as a structured reward model across eight public benchmark tracks"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "tqdm>=4.66,<5",
]

[project.scripts]
jev-eval = "jev_eval.runner:main"
jev-report = "jev_eval.report:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_eval"]
